<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos — Ação Social Fortalecendo Com Você</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --verde-escuro: #1a3a2a;
      --verde-medio: #2d6a4f;
      --verde-claro: #52b788;
      --dourado: #d4a843;
      --creme: #f9f3e8;
      --creme-escuro: #ede4d0;
      --texto: #1c1c1c;
      --texto-suave: #5a5a5a;
      --branco: #ffffff;
      --encerrado: #e74c3c;
      --ativo: #27ae60;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--creme);
      color: var(--texto);
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      background: var(--verde-escuro);
      position: relative;
      overflow: hidden;
      padding: 60px 24px;
      text-align: center;
    }

    .header-inner {
      position: relative;
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .logo-ring {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid var(--dourado);
      padding: 5px;
      background: rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: contain; }

    .header-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      color: var(--branco);
      font-weight: 900;
    }

    .header-title span { color: var(--verde-claro); }

    /* ── NAV ── */
    nav {
      background: var(--branco);
      border-bottom: 2px solid var(--creme-escuro);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .nav-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      justify-content: center;
    }

    nav a {
      display: inline-block;
      color: var(--texto-suave);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 15px 20px;
      transition: 0.2s;
    }

    nav a:hover, nav a.active { color: var(--verde-medio); border-bottom: 3px solid var(--verde-claro); }

    /* ── MAIN ── */
    main { max-width: 960px; margin: 0 auto; padding: 40px 24px; }

    section { padding: 40px 0; border-bottom: 1px solid var(--creme-escuro); }

    .section-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--verde-claro); margin-bottom: 8px; }

    .section-title { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--verde-escuro); margin-bottom: 24px; }

    /* ── EVENTO CARD ── */
    .evento-card {
      background: var(--branco);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--creme-escuro);
      display: grid;
      grid-template-columns: 300px 1fr;
      margin-bottom: 24px;
    }

    .evento-img { width: 100%; height: 100%; object-fit: cover; min-height: 250px; }

    .evento-body { padding: 30px; display: flex; flex-direction: column; gap: 12px; }

    .status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; width: fit-content; }
    .status.ativo { background: #d4edda; color: var(--ativo); }
    .status.encerrado { background: #fde8e8; color: var(--encerrado); }

    /* ── SLIDER ── */
    .slider-wrapper { position: relative; width: 100%; border-radius: 20px; overflow: hidden; aspect-ratio: 16/9; background: #000; }
    .slide-item { position: absolute; inset: 0; opacity: 0; transition: 0.6s; }
    .slide-item.active { opacity: 1; }
    .slide-item img { width: 100%; height: 100%; object-fit: cover; }

    .slider-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.3); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 10; font-size: 20px; }
    .prev { left: 10px; } .next { right: 10px; }

    /* ── FOOTER ── */
    footer { background: var(--verde-escuro); color: white; text-align: center; padding: 40px 24px; font-size: 0.9rem; margin-top: 40px; }

    .reveal { opacity: 0; transform: translateY(20px); transition: 0.6s; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 700px) { .evento-card { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-ring">
      <img src="imagens/escudo1.jpeg" alt="Logo">
    </div>
    <h1 class="header-title">Nossos <span>Eventos</span></h1>
  </div>
</header>

<nav>
  <div class="nav-inner">
    <a href="index.html">Início</a>
    <a href="#eventos" class="active">Eventos</a>
    <a href="#fotos">Fotos</a>
  </div>
</nav>

<main>
  <section id="eventos" class="reveal">
    <p class="section-label">Ações Recentes</p>
    <h2 class="section-title">Campanhas</h2>

    <div class="evento-card">
      <img class="evento-img" src="imagens eventos/campanha do agasalho.jpg" alt="Agasalho">
      <div class="evento-body">
        <span class="status ativo">Em andamento</span>
        <h3 style="font-family: 'Playfair Display'; font-size: 1.5rem;">Campanha do Agasalho 2026</h3>
        <p style="color: var(--texto-suave); line-height: 1.6;">Estamos arrecadando cobertores e roupas de frio para famílias da região.</p>
      </div>
    </div>
  </section>

  <section id="fotos" class="reveal">
    <h2 class="section-title">Galeria de Ações</h2>
    <div class="slider-wrapper">
      <div class="slide-item active"><img src="imagens eventos/evento.jpeg"></div>
      <div class="slide-item"><img src="imagens eventos/evento1.jpeg"></div>
      <div class="slide-item"><img src="imagens eventos/evento2.jpeg"></div>
      <button class="slider-arrow prev" onclick="changeSlide(-1)">❮</button>
      <button class="slider-arrow next" onclick="changeSlide(1)">❯</button>
    </div>
  </section>
</main>

<footer>
  <strong>Ação Social Fortalecendo Com Você</strong><br>
  Transformando vidas através da solidariedade.
</footer>

<script>
  // Revelar ao scroll
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => e.isIntersecting && e.target.classList.add('visible'));
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

  // Slider
  let current = 0;
  const slides = document.querySelectorAll('.slide-item');
  function changeSlide(n) {
    slides[current].classList.remove('active');
    current = (current + n + slides.length) % slides.length;
    slides[current].classList.add('active');
  }
  setInterval(() => changeSlide(1), 5000);
</script>

</body>
</html>
